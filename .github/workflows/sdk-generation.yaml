name: 'Generate .NET 9 SDK'
on:
  workflow_dispatch:
    inputs:
      force:
        description: Force SDK regeneration even if no changes are detected
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *' 
permissions:
  id-token: write
  contents: write
  pull-requests: write
jobs:
  generate-dotnet-sdk:
    runs-on: ubuntu-latest
    env:
      SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGEN_BRANCH: sdk-auto-gen-dotnet9
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check OpenAPI spec changes
        id: check_spec
        run: |
          mkdir -p /tmp/openapi
          curl -fsS -o /tmp/openapi/current_spec.yml https://s3.amazonaws.com/dp-devportal-images/oas/openapi.yml
          if [ -f "openapi_spec_cache.yml" ]; then
            echo "Found cached spec, comparing..."
            if cmp -s "openapi_spec_cache.yml" "/tmp/openapi/current_spec.yml"; then
              echo "Published OpenAPI spec matches the cached spec on main"
              echo "SPEC_CHANGED=false" >> "$GITHUB_ENV"
            else
              echo "Published OpenAPI spec differs from the cached spec on main"
              SPEC_CHANGED=true
              # gen.lock differs every run, so regenerating this spec would force-push the open PR and dismiss its approvals.
              OPEN_PR=$(gh pr list --head "$REGEN_BRANCH" --base main --state open --json isCrossRepository --jq 'any(.[]; .isCrossRepository | not)')
              if [ "$OPEN_PR" = true ]; then
                git fetch --depth=1 origin "refs/heads/$REGEN_BRANCH"
                git show FETCH_HEAD:openapi_spec_cache.yml > /tmp/openapi/pr_spec.yml
                if cmp -s /tmp/openapi/pr_spec.yml /tmp/openapi/current_spec.yml; then
                  echo "Open PR on $REGEN_BRANCH already has the published OpenAPI spec"
                  SPEC_CHANGED=false
                fi
              fi
              echo "SPEC_CHANGED=$SPEC_CHANGED" >> "$GITHUB_ENV"
            fi
          else
            echo "No cached spec found, treating as changed"
            echo "SPEC_CHANGED=true" >> "$GITHUB_ENV"
          fi
          cp "/tmp/openapi/current_spec.yml" "openapi_spec_cache.yml"
      - name: Stop if no regeneration is needed
        if: env.SPEC_CHANGED == 'false' && github.event.inputs.force != 'true'
        run: |
          echo "No SDK regeneration needed and force is not enabled. Skipping SDK generation..."
          exit 0
      - name: Install dependencies
        if: env.SPEC_CHANGED == 'true' || github.event.inputs.force == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y make git
      - name: Install Speakeasy CLI
        if: env.SPEC_CHANGED == 'true' || github.event.inputs.force == 'true'
        run: |
          curl -sSL https://raw.githubusercontent.com/speakeasy-api/speakeasy/main/install.sh | bash
          echo "$HOME/.speakeasy/bin" >> "$GITHUB_PATH"
      - name: Generate SDK
        if: env.SPEC_CHANGED == 'true' || github.event.inputs.force == 'true'
        run: make generate-sdk
      - name: Create Pull Request
        if: env.SPEC_CHANGED == 'true' || github.event.inputs.force == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.REGEN_BRANCH }}
          base: main
          commit-message: "chore: regenerate .NET 9 SDK"
          title: "chore: regenerate .NET 9 SDK - OpenAPI spec updated"
          body: |
            This PR was auto-generated due to changes in the OpenAPI specification.
            
            Changes detected in: https://s3.amazonaws.com/dp-devportal-images/oas/openapi.yml
